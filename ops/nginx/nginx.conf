worker_processes 1;
events { worker_connections 1024; }

http {
    # Structured (JSON) access log — one line per HTTP request, for the 5651 access record
    # and central aggregation (Promtail → Loki). Captures who (IP), when, what, and result.
    log_format json_access escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    # The API runs on the host (make run, bound to 0.0.0.0:5080).
    upstream kentos_app {
        server host.docker.internal:5080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://kentos_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
