name: kentos-core

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: kentos-postgres
    environment:
      POSTGRES_USER: kentos
      POSTGRES_PASSWORD: kentos
      POSTGRES_DB: kentos
    ports:
      - "5432:5432"
    volumes:
      - kentos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kentos -d kentos"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: kentos-mongo
    ports:
      - "27017:27017"
    volumes:
      - kentos-mongo:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: kentos-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: kentos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - kentos-grafana:/var/lib/grafana
      # Auto-provision the Prometheus datasource + the starter dashboard.
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # Reverse proxy in front of the host-run API: keeps JSON HTTP access logs (5651) and
  # forwards the real client IP via X-Forwarded-For. Browse the app through http://localhost:8080.
  nginx:
    image: nginx:1.27-alpine
    container_name: kentos-nginx
    ports:
      - "8080:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Central log store (queried by Grafana). Retention configured in ops/loki/loki-config.yml.
  loki:
    image: grafana/loki:3.2.1
    container_name: kentos-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - kentos-loki:/loki

  # Ships nginx access logs + the API's file logs to Loki.
  promtail:
    image: grafana/promtail:3.2.1
    container_name: kentos-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs/nginx:/proxylogs:ro
      - ./src/Kentos.Host/logs:/applogs:ro
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: kentos-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  kentos-postgres:
  kentos-mongo:
  kentos-grafana:
  kentos-loki:
