name: kentos-core

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: kentos-postgres
    environment:
      POSTGRES_USER: kentos
      POSTGRES_PASSWORD: kentos
      POSTGRES_DB: kentos
    ports:
      - "5432:5432"
    volumes:
      - kentos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kentos -d kentos"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: kentos-mongo
    ports:
      - "27017:27017"
    volumes:
      - kentos-mongo:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: kentos-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: kentos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - kentos-grafana:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: kentos-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # Optional: run Keycloak in Docker instead of the local install.
  # Enable with:  docker compose --profile keycloak up -d
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kentos-keycloak
    profiles: ["keycloak"]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  kentos-postgres:
  kentos-mongo:
  kentos-grafana:
